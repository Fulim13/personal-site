# Tech Cards.
#
# type   — one of: language, framework, runtime, data, messaging, infra,
#          tooling, testing, design, practice. Each maps to a card accent.
# glyph  — one or two characters, or an emoji. Deliberately not an image, so
#          the page stays asset-free.
# level  — 1..5, drawn as pips. Five means you could teach it.
# flavour— the italic line at the bottom of the card. It is the part people
#          actually read, so keep it short and a little funny.
#
